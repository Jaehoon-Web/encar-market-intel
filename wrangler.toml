name = "carisma-r"                       # 2026-11-03 대시보드에서 Worker 이름을 바꿈(기획 v2.25) — 대시보드 이름과 같아야 자동 배포가 된다
main = "worker/index.js"
compatibility_date = "2025-01-01"

# web/ 폴더를 정적 자산으로 서빙하고, /api/* 는 Worker(worker/index.js)가 먼저 받는다 — 환산 비율 팀 공용 저장소(기획안 D6)
# /downloads/* 도 Worker가 먼저 받아 막는다 — 데이터 탭을 닫음(2026-11-05 사용자 요청)
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/downloads/*"]

# 환산 비율 팀 수정 저장소(KV "encar-rates"). 수정 비밀번호는 비밀값 RATES_PASSWORD(wrangler secret put — 저장소에 넣지 않음)
[[kv_namespaces]]
binding = "RATES"
id = "560f410dafd740fba1e8a624fe428f3e"

# 이용 통계(기획 v2.28 · 5.11) — 익명 행동 기록. 이름·IP·입력 조건은 넣지 않는다. 관리자 비밀번호는 비밀값 ADMIN_PASSWORD(사용자가 직접)
[[d1_databases]]
binding = "STATS"
database_name = "carisma-r-stats"
database_id = "7e65736e-0f53-4330-8efb-922938ccebb5"

# 매일 03:00(한국 = 18:00 UTC) 이용 통계 하루 요약 · 1년 지난 기록 지우기(worker/index.js scheduled)
[triggers]
crons = ["0 18 * * *"]
